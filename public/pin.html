<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISKCON Receipts — Enter PIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#EFEAE0;
    font-family:'Inter',sans-serif;
    color:#2B2420;
  }
  .box{
    background:#fff;
    border:1px solid #E4DFD4;
    border-radius:10px;
    padding:32px 28px;
    width:100%;
    max-width:320px;
    text-align:center;
  }
  h1{
    font-family:'Cormorant Garamond',serif;
    font-weight:700;
    font-size:22px;
    color:#5A1620;
    margin:0 0 6px;
  }
  p{font-size:13px;color:#7a7264;margin:0 0 20px;}
  input{
    width:100%;
    padding:12px;
    font-size:18px;
    letter-spacing:4px;
    text-align:center;
    border:1px solid #D8D2C4;
    border-radius:7px;
    box-sizing:border-box;
    margin-bottom:14px;
  }
  button{
    width:100%;
    padding:12px;
    background:#7A1F2B;
    color:#fff;
    border:none;
    border-radius:7px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  button:hover{background:#5A1620;}
  .err{color:#a3222f;font-size:12.5px;margin-top:12px;min-height:16px;}
</style>
</head>
<body>
  <div class="box">
    <h1>ISKCON Juhu Sankirtan</h1>
    <p>Enter the shared access PIN to continue</p>
    <input type="password" id="pin" inputmode="numeric" placeholder="••••" maxlength="12" autofocus>
    <button onclick="submitPin()">Enter</button>
    <div class="err" id="err"></div>
  </div>
<script>
  function getNext(){
    const params = new URLSearchParams(window.location.search);
    return params.get('next') || '/';
  }
  async function submitPin(){
    const pin = document.getElementById('pin').value.trim();
    const errEl = document.getElementById('err');
    errEl.textContent = '';
    if(!pin){ errEl.textContent = 'Enter the PIN.'; return; }
    try{
      const res = await fetch('/api/auth', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ pin })
      });
      const data = await res.json();
      if(data.ok){
        window.location.href = getNext();
      } else {
        errEl.textContent = data.message || 'Incorrect PIN.';
      }
    }catch(e){
      errEl.textContent = 'Something went wrong. Try again.';
    }
  }
  document.getElementById('pin').addEventListener('keydown', e=>{
    if(e.key==='Enter') submitPin();
  });
</script>
</body>
</html>
